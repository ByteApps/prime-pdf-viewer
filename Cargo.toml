[package]
name = "prime-pdf-viewer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
log = "0.4"
# Pure-Rust PDF rasterizer. Pinned: newer hayro requires rustc >= 1.92, but the
# SDK Nix shell pins nightly-2025-09-11 (1.91). Don't bump until the toolchain moves.
hayro = "0.7"
log-server = { package = "xous-api-log", path = "../keyos-sdk/lib/keyos/xous/api/log" }
server = { path = "../keyos-sdk/lib/keyos/server" }
slint-keyos-platform = { path = "../keyos-sdk/lib/keyos/slint-keyos-platform/runtime" }
foundation-themes = { path = "../keyos-sdk/lib/keyos/sdk/crates/foundation-themes" }

[build-dependencies]
foundation-themes = { path = "../keyos-sdk/lib/keyos/sdk/crates/foundation-themes" }
slint-keyos-platform-build = { path = "../keyos-sdk/lib/keyos/slint-keyos-platform/build" }

[dev-dependencies]
# Only for encoding synthetic test JPEGs in tests/dct_downsample.rs; not part
# of the shipped app's dependency graph.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Vendored to patch DCTDecode with target_dimension-aware scaled decoding
# (see vendor/hayro-syntax/src/filter/dct.rs). Version must stay 0.7.2 to
# match the semver range hayro 0.7 depends on.
[patch.crates-io]
hayro-syntax = { path = "vendor/hayro-syntax" }
