[package]
name = "prime-pdf-viewer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
log = "0.4"
# Pure-Rust PDF rasterizer. Pinned: newer hayro requires rustc >= 1.92, but the
# SDK Nix shell pins nightly-2025-09-11 (1.91). Don't bump until the toolchain moves.
hayro = "0.7"
log-server = { package = "xous-api-log", path = "../keyos-sdk/lib/keyos/xous/api/log" }
server = { path = "../keyos-sdk/lib/keyos/server" }
slint-keyos-platform = { path = "../keyos-sdk/lib/keyos/slint-keyos-platform/runtime" }
foundation-themes = { path = "../keyos-sdk/lib/keyos/sdk/crates/foundation-themes" }

[build-dependencies]
foundation-themes = { path = "../keyos-sdk/lib/keyos/sdk/crates/foundation-themes" }
slint-keyos-platform-build = { path = "../keyos-sdk/lib/keyos/slint-keyos-platform/build" }

[dev-dependencies]
# Only for encoding synthetic test JPEGs in tests/dct_downsample.rs; not part
# of the shipped app's dependency graph.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Only for encoding synthetic FlateDecode (zlib) image streams in
# tests/interpret_downsample.rs; not part of the shipped app's dependency graph.
flate2 = "1"
# Only for implementing a minimal hayro_interpret::Device in
# tests/interpret_downsample.rs (its trait methods are typed in terms of
# kurbo geometry); pinned to 0.13 to match hayro-interpret 0.7.0's own
# dependency so the types are the same crate, not just semver-compatible.
kurbo = "0.13"

# Vendored to patch DCTDecode with target_dimension-aware scaled decoding
# (see vendor/hayro-syntax/src/filter/dct.rs). Version must stay 0.7.2 to
# match the semver range hayro 0.7 depends on.
#
# Vendored to downsample decoded raster images (all filters, not just DCT)
# toward target_dimension before they're cached/composited (see
# vendor/hayro-interpret/src/x_object.rs). Version must stay 0.7.0 to match
# the semver range hayro 0.7 depends on; its own hayro-syntax dependency
# resolves to the vendor/hayro-syntax patch above through this same table.
[patch.crates-io]
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-interpret = { path = "vendor/hayro-interpret" }
# Vendored jpeg-decoder 0.3.2 (reached via hayro-syntax's scaled-DCT patch)
# with ONE fix, byte-identical to prime-image-viewer's copy: never select the
# mpsc worker on KeyOS -- its UNBOUNDED channels queue every coefficient row
# when the single-core producer outruns the worker threads (~3 bytes/pixel)
# and OOM the Prime's 128 MB pool with an uncatchable crash. Found
# 2026-08-19 via prime-image-viewer's img-6000.jpg calibration crash;
# filed upstream: image-rs/jpeg-decoder#290.
jpeg-decoder = { path = "vendor/jpeg-decoder" }
